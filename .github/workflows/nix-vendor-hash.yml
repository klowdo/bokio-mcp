name: nix-vendor-hash

on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - flake.nix

permissions:
  contents: write

jobs:
  update-hash:
    name: Update vendorHash
    runs-on: ubuntu-latest
    # ponytail: only Renovate branches in this repo; bot push won't re-trigger CI, but the
    # hash isn't a PR gate anymore (validated at release), so merge correctness is unaffected.
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v5
      with:
        ref: ${{ github.head_ref }}

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        extra_nix_config: |
          experimental-features = nix-command flakes
          access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

    - name: Recompute vendorHash
      run: ./scripts/update-nix-hash.sh

    - name: Commit if changed
      run: |
        if ! git diff --quiet flake.nix; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore: update nix vendorHash"
          git push
        else
          echo "vendorHash already up to date"
        fi
